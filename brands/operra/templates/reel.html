<!doctype html>
<meta charset="utf-8">
<title>reel</title>
<style>
  @font-face { font-family: Inter; src: url("../assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: Inter; src: url("../assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: Inter; src: url("../assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; }
  @font-face { font-family: Inter; src: url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #bg {
    position: absolute; inset: -6%;
    background-size: cover; background-position: center;
    background-color: var(--bg);
    will-change: transform;
  }
  #bg.fallback {
    background-image:
      radial-gradient(64% 34% at 72% 26%, color-mix(in srgb, var(--primary) 62%, transparent) 0%, transparent 70%),
      radial-gradient(70% 40% at 14% 82%, color-mix(in srgb, var(--teal) 34%, transparent) 0%, transparent 66%),
      radial-gradient(46% 26% at 34% 6%, color-mix(in srgb, var(--primaryGlow) 22%, transparent) 0%, transparent 72%);
  }
  #bg.fallback + #scrim { opacity: 0.18; }
  #scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--bg) 58%, transparent) 0%,
      color-mix(in srgb, var(--bg) 74%, transparent) 40%,
      color-mix(in srgb, var(--bg) 97%, transparent) 100%);
  }

  #frame { position: absolute; inset: 0; padding: 130px 90px; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; }
  #logo { height: 52px; width: auto; }
  #eyebrow {
    font-size: 22px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--primary); border: 1px solid var(--border); background: var(--cardBg);
    border-radius: var(--pill); padding: 14px 30px;
  }

  main { margin-top: auto; margin-bottom: auto; }
  /* Each beat is a full line of the script, revealed one at a time. */
  .beat {
    font-size: 92px; font-weight: 600; line-height: 1.12; letter-spacing: -0.025em;
    color: var(--text); max-width: 16ch; text-wrap: balance;
    position: absolute; left: 90px; right: 90px;
    opacity: 0; will-change: opacity, transform;
  }
  .beat.small { font-size: 72px; }
  .beat.xsmall { font-size: 58px; }

  #rule { width: 110px; height: 8px; border-radius: 8px; background: var(--primary); opacity: 0; }

  footer { display: flex; align-items: center; justify-content: space-between; }
  #cta {
    font-size: 30px; font-weight: 600; color: var(--bg);
    background: var(--primary); border-radius: var(--pill); padding: 26px 52px;
    opacity: 0; will-change: opacity, transform;
  }
  #site { font-size: 30px; font-weight: 500; color: var(--textLight); opacity: 0; }

  /* Progress hairline — gives the viewer a reason to stay. */
  #progress { position: absolute; left: 0; top: 0; height: 6px; background: var(--primary); width: 0; }
</style>

<div id="bg" class="fallback"></div>
<div id="scrim"></div>
<div id="progress"></div>
<div id="frame">
  <header>
    <img id="logo" alt="">
    <span id="eyebrow"></span>
  </header>
  <main id="beats"></main>
  <footer>
    <span id="cta"></span>
    <span id="site"></span>
  </footer>
</div>

<script>
  /**
   * Deterministic seeking: nothing animates on its own. The renderer calls
   * setFrame(t) for each timestamp, so frame N is identical on every run and
   * the video always matches the voiceover length.
   */
  window.__reel = { beats: [], duration: 8 };

  /**
   * Motion style. Every value defaults to what this template has always done,
   * so a config with no style renders exactly as before — the twelve styles are
   * additive, not a rewrite of working choreography.
   */
  const DEFAULT_STYLE = {
    enter: "up", exit: "fade", bg: "drift", align: "left",
    rule: "bar", progress: "top", cta: "rise", pace: 0.4,
  };
  function style() { return Object.assign({}, DEFAULT_STYLE, window.__reel.style || {}); }

  function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }

  /** Where a beat sits before it arrives, and where it goes as it leaves. */
  function offsetFor(kind, amount) {
    switch (kind) {
      case "down":  return { x: 0, y: -amount, s: 1, b: 0 };
      case "left":  return { x: -amount * 1.6, y: 0, s: 1, b: 0 };
      case "right": return { x: amount * 1.6, y: 0, s: 1, b: 0 };
      case "scale": return { x: 0, y: 0, s: 0.86, b: 0 };
      case "blur":  return { x: 0, y: amount * 0.3, s: 1, b: 8 };
      case "shrink":return { x: 0, y: 0, s: 0.94, b: 0 };
      case "slide": return { x: 0, y: -amount * 0.7, s: 1, b: 0 };
      case "fade":  return { x: 0, y: 0, s: 1, b: 0 };
      default:      return { x: 0, y: amount, s: 1, b: 0 };  // "up"
    }
  }

  window.setFrame = function (t) {
    const { beats, duration } = window.__reel;
    const st = style();
    const n = beats.length || 1;
    const intro = 0.45;
    const outro = 3.2;
    const body = Math.max(1, duration - outro);
    const per = (body - intro) / n;

    // Background motion — the same slow drift as before unless the style says
    // otherwise. Always a single continuous move so nothing jumps on a seek.
    const p = clamp01(t / duration);
    const bgEl = document.getElementById("bg");
    switch (st.bg) {
      case "zoom-in":   bgEl.style.transform = `scale(${1.02 + p * 0.14})`; break;
      case "zoom-out":  bgEl.style.transform = `scale(${1.16 - p * 0.13})`; break;
      case "pan-left":  bgEl.style.transform = `scale(1.12) translate3d(${p * 34}px, 0, 0)`; break;
      case "pan-right": bgEl.style.transform = `scale(1.12) translate3d(${-p * 34}px, 0, 0)`; break;
      case "still":     bgEl.style.transform = "scale(1.04)"; break;
      default:          bgEl.style.transform =
                          `scale(${1.04 + p * 0.09}) translate3d(${-p * 14}px, ${-p * 22}px, 0)`;
    }
    document.getElementById("progress").style.width = `${p * 100}%`;

    // Header settles in the first half second.
    const h = ease(clamp01(t / intro));
    document.getElementById("logo").style.opacity = h;
    document.getElementById("eyebrow").style.opacity = h;
    document.getElementById("eyebrow").style.transform = `translateY(${(1 - h) * 18}px)`;

    // One beat at a time: in, hold, out. The LAST beat never fades — it holds
    // under the call to action so the closing frame still says something.
    beats.forEach((_, i) => {
      const el = document.getElementById(`beat-${i}`);
      const isLast = i === n - 1;
      const start = intro + i * per;
      const local = t - start;
      const from = offsetFor(st.enter, 26);
      const to = offsetFor(st.exit, 26);

      let o = 0, x = from.x, y = from.y, sc = from.s, bl = from.b;
      if (local >= 0 && (isLast || local < per)) {
        const inP = ease(clamp01(local / st.pace));
        const outP = isLast ? 1 : ease(clamp01((per - local) / 0.35));
        o = Math.min(inP, outP);
        // Arriving interpolates from `from` to rest; leaving goes on to `to`.
        x = (1 - inP) * from.x + (1 - outP) * to.x;
        y = (1 - inP) * from.y + (1 - outP) * to.y;
        sc = 1 - (1 - inP) * (1 - from.s) - (1 - outP) * (1 - to.s);
        bl = (1 - inP) * from.b + (1 - outP) * to.b;
      }
      el.style.opacity = o;
      el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${sc})`;
      el.style.filter = bl > 0.05 ? `blur(${bl}px)` : "none";
    });

    // "grow" draws the rule out rather than fading it in; "none" hides it.
    const ruleEl = document.getElementById("rule");
    const ruleOn = ease(clamp01((t - intro) / 0.5));
    if (st.rule === "none") {
      ruleEl.style.opacity = 0;
    } else {
      ruleEl.style.opacity = ruleOn * 0.9;
      if (st.rule === "grow") ruleEl.style.width = `${ruleOn * 110}px`;
    }

    // The CTA lands for the final beat and stays.
    const c = ease(clamp01((t - (duration - outro)) / 0.55));
    const ctaEl = document.getElementById("cta");
    ctaEl.style.opacity = c;
    if (st.cta === "pop") {
      // Overshoot slightly, then settle — read as arriving rather than sliding.
      ctaEl.style.transform = `scale(${0.86 + c * 0.17 - Math.max(0, c - 0.82) * 0.17})`;
    } else if (st.cta === "slide") {
      ctaEl.style.transform = `translate3d(${(1 - c) * -40}px, 0, 0)`;
    } else {
      ctaEl.style.transform = `translateY(${(1 - c) * 20}px)`;
    }
    document.getElementById("site").style.opacity = c;
  };

  window.buildReel = function (config) {
    window.__reel = config;
    const st = style();

    // Layout choices are set once, here, not per frame — they do not animate.
    const stage = document.getElementById("stage") || document.body;
    stage.style.textAlign = st.align === "center" ? "center" : "";
    if (st.align === "center") {
      stage.style.alignItems = "center";
      const eb = document.getElementById("eyebrow");
      if (eb) eb.style.margin = "0 auto";
    }

    const bar = document.getElementById("progress");
    if (bar) {
      if (st.progress === "none") bar.style.display = "none";
      else if (st.progress === "bottom") { bar.style.top = "auto"; bar.style.bottom = "0"; }
    }

    const host = document.getElementById("beats");
    host.innerHTML = "";
    config.beats.forEach((text, i) => {
      const el = document.createElement("div");
      el.className = "beat" + (text.length > 58 ? " xsmall" : text.length > 34 ? " small" : "");
      el.id = `beat-${i}`;
      el.textContent = text;
      host.appendChild(el);
    });
    const rule = document.createElement("div");
    rule.id = "rule";
    rule.style.position = "absolute";
    rule.style.bottom = "-70px";
    if (st.align === "center") {
      rule.style.left = "50%";
      rule.style.transform = "translateX(-50%)";
    } else {
      rule.style.left = "90px";
    }
    // "dot" is the same element as a square; "grow" is drawn out by setFrame.
    if (st.rule === "dot") {
      rule.style.width = "18px";
      rule.style.height = "18px";
      rule.style.borderRadius = "50%";
    } else if (st.rule === "grow") {
      rule.style.width = "0px";
    }
    host.appendChild(rule);
    window.setFrame(0);
  };
</script>
