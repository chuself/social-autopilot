name: listen

# Every 15 minutes: pick up whatever you told the bot on Telegram.
# Telegram holds messages for 24h, so nothing is lost between runs.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency: autopilot-state

jobs:
  listen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Read the inbox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/cli-listen.js

      - name: Save instructions
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add -f state/steer.md state/telegram-offset.json state/PAUSED 2>/dev/null || true
          git add -A state
          git diff --staged --quiet || git commit -m "chore: instructions from Telegram [skip ci]"
          git push

      # A routine change is only real once the schedule is rebuilt.
      - name: Re-plan if the routine changed
        if: hashFiles('state/REPLAN') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f state/REPLAN
          git add -A state && git commit -m "chore: replan triggered [skip ci]" || true
          git push || true
          gh workflow run plan-week --field replace=1
