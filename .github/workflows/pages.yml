name: pages

# Publishes ./public on demand and whenever its contents change. Assets are
# normally deployed by the plan and reel jobs; this exists so a static page
# (like the privacy policy) can go live without building anything.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Newest wins. Three deploys once landed within 14 seconds and the one built
# from the OLDEST commit finished last, rolling the whole site back to a tree
# that predated that evening's poster. The poster then 404'd, Instagram could
# not fetch it, and the slot passed with nothing posted and nothing logged.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      # Always deploy the tip of main, never the sha that happened to trigger
      # this run. A queued run then cannot publish stale content whenever it
      # finishes, so deploy order stops mattering.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: echo "deployed ${{ steps.deploy.outputs.page_url }}"
