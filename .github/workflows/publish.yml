name: publish

# 09:00 and 17:00 EAT
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = log only, post nothing"
        default: "0"

concurrency: autopilot-state

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: Publish anything due
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          AUTO_APPROVE_HOURS: "24"
        run: node src/cli-publish.js

      - name: Record what went out
        if: ${{ inputs.dry_run != '1' }}
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add -f state/history.json state/queue.json
          git diff --staged --quiet || git commit -m "chore: post history [skip ci]"
          git push

      - name: Shout if publishing failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node -e "import('./src/notify.js').then(m=>m.notifyFailure('Publishing FAILED.','See the Actions log.'))"
