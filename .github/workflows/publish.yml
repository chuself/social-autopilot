name: publish

on:
  workflow_dispatch:
    inputs:
      post_file:
        description: "Post JSON to publish"
        default: "state/sample-post.json"
      dry_run:
        description: "1 = render and log only"
        default: "1"
  # Phase 3 turns these on. Times are UTC; Tanzania is UTC+3.
  # schedule:
  #   - cron: "0 6 * * *"   # 09:00 EAT
  #   - cron: "0 14 * * *"  # 17:00 EAT

jobs:
  # Render first and push the PNG, so Cloudflare Pages is serving it publicly
  # BEFORE Instagram tries to fetch it. Publishing first always fails.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: node src/cli-render.js "${{ inputs.post_file }}"
      - name: Push the rendered asset
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/*.png
          git diff --staged --quiet || git commit -m "chore: render assets [skip ci]"
          git push

  publish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.ref }} }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev || npm install --omit=dev

      # Cloudflare Pages needs a moment to deploy the commit above.
      - name: Wait for the asset to go live
        run: sleep 90

      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git pull --rebase
          node src/cli-publish.js "${{ inputs.post_file }}"

      - name: Record history
        if: ${{ inputs.dry_run != '1' }}
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/history.json
          git diff --staged --quiet || git commit -m "chore: post history [skip ci]"
          git push
