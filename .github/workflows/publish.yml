name: publish

# Hourly. The posting times live in state/config.json (changeable from Telegram),
# so the cron only has to be finer-grained than any slot the owner can pick.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = log only, post nothing"
        default: "0"
      auto_approve_hours:
        description: "Hours before a pending post goes out (0 = immediately)"
        default: "24"

concurrency: autopilot-state

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # A 404 on an asset dispatches a Pages deploy to fix itself.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev || npm install --omit=dev

      # Your rejections in the Sheet must be honoured before anything goes out.
      - name: Pull approvals from the Sheet
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
        run: node src/cli-sheet.js

      - name: Publish anything due
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          WHATSAPP_CTA_NUMBER: ${{ vars.WHATSAPP_CTA_NUMBER }}
          AUTO_APPROVE_HOURS: ${{ inputs.auto_approve_hours || '24' }}
        run: node src/cli-publish.js

      # A committed asset that Pages is not serving fixes itself rather than
      # failing quietly every hour until the slot has gone.
      # One job owns "is it time?" for EVERY format.
      #
      # Reels used to be published only inside the same job that filmed them,
      # gated on that job having built something. A reel filmed early correctly
      # declined to post before its slot — and then nothing ever came back for
      # it, because the next reel run had nothing left to film and skipped every
      # downstream step. A filmed reel could strand for good. Now the hourly
      # reconciler picks it up like anything else. Needs no renderer: the MP4 is
      # already built and already live on Pages.
      - name: Publish any reel whose slot has arrived
        id: reel
        # A reconciler must never die for one item. A transient 503 from Pages
        # on one MP4 took down the whole publish run and reported "Publishing
        # FAILED" as though nothing at all had gone out. Whatever happens to the
        # reel, the posters that already published still get recorded and the
        # next hourly run still comes.
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          WHATSAPP_CTA_NUMBER: ${{ vars.WHATSAPP_CTA_NUMBER }}
          METRICOOL_KEY: ${{ secrets.METRICOOL_KEY }}
          METRICOOL_OAUTH: ${{ secrets.METRICOOL_OAUTH }}
          METRICOOL_BLOG_ID: ${{ vars.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ vars.METRICOOL_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node src/cli-publish-reel.js

      # After BOTH publishers, so it can see either one's request. A committed
      # asset that Pages is not serving stays unserved until something
      # redeploys it, and the slot passes in silence every hour until then.
      - name: Redeploy Pages if an asset was unreachable
        if: steps.publish.outputs.redeploy == 'true' || steps.reel.outputs.redeploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages

      - name: Record what went out
        if: ${{ always() && inputs.dry_run != '1' }}
        run: |
          bash scripts/push-state.sh "chore: post history [skip ci]" \
            state/history.json state/queue.json state/metricool.enc

      - name: Shout if publishing failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node -e "import('./src/notify.js').then(m=>m.notifyFailure('Publishing FAILED.','See the Actions log.'))"
