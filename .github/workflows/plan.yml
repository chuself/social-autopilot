name: plan-week

# Sunday 18:00 EAT (Tanzania is UTC+3)
on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      count:
        description: "How many posts to plan"
        default: "7"

concurrency: autopilot-state

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: npx playwright install --with-deps chromium

      # Last week's numbers shape this week's writing.
      - name: Score what already went out
        continue-on-error: true
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node src/cli-metrics.js

      - name: Write the week
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POST_HOUR: "9"
        run: node src/cli-plan.js --count "${{ inputs.count || 7 }}"

      # The posters must be publicly reachable before publish day, because
      # Instagram fetches the image URL server-side.
      - name: Deploy posters to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy public --project-name social-autopilot --branch main --commit-dirty=true

      - name: Commit the queue
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/*.png state/queue.json state/top-performers.json
          git diff --staged --quiet || git commit -m "chore: plan week [skip ci]"
          git push

      - name: Sync the review Sheet
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
        run: node src/cli-sheet.js

      - name: Send the digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/cli-digest.js

      - name: Shout if the plan failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node -e "import('./src/notify.js').then(m=>m.notifyFailure('Weekly planning FAILED - no posts queued for the coming week.','See the Actions log.'))"
