name: plan-week

# Sunday 18:00 EAT (Tanzania is UTC+3)
on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      count:
        description: "How many posts to plan (blank = 7 days at the configured cadence)"
        default: ""
      replace:
        description: "1 = discard unposted posts and rebuild the schedule"
        default: "0"

concurrency: autopilot-state

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: npx playwright install --with-deps chromium

      # Last week's numbers shape this week's writing.
      - name: Score what already went out
        continue-on-error: true
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node src/cli-metrics.js

      - name: Write the week
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.count }}" ] && ARGS="--count ${{ inputs.count }}"
          [ "${{ inputs.replace }}" = "1" ] && ARGS="$ARGS --replace"
          node src/cli-plan.js $ARGS

      - name: Commit the queue
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/*.png state/bg/*.png state/queue.json state/top-performers.json state/pillar-scores.json state/config.json
          git diff --staged --quiet || git commit -m "chore: plan week [skip ci]"
          # Another job (or a human) may have pushed while this run was writing.
          git pull --rebase --autostash
          git push

      # The posters must be publicly reachable before publish day, because
      # Instagram fetches the image URL server-side.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: pages
        uses: actions/deploy-pages@v4

      - name: Confirm the posters are live
        run: |
          for f in public/*.png; do
            url="${{ vars.PUBLIC_ASSET_BASE }}/$(basename "$f")"
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "$code  $url"
          done

      - name: Sync the review Sheet
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
        run: node src/cli-sheet.js

      - name: Send the digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node src/cli-digest.js

      - name: Shout if the plan failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node -e "import('./src/notify.js').then(m=>m.notifyFailure('Weekly planning FAILED - no posts queued for the coming week.','See the Actions log.'))"
