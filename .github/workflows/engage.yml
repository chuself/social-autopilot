name: engage

# Every 30 minutes: answer comments, escalate buying signals.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = classify and log, reply to nothing"
        default: "0"

# NOT autopilot-state. That group exists to serialise writes to state/queue.json
# and engage never touches it — it writes replied, our-comments, leads and
# alerts. Sharing the lock only meant engage queued behind publish and got
# cancelled, which is exactly what happened the first time the heartbeat fired
# them together.
concurrency: autopilot-engage

jobs:
  engage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Read and answer comments
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHATSAPP_CTA_NUMBER: ${{ vars.WHATSAPP_CTA_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node src/cli-engage.js

      # always(): state/alerts.json is what stops an ongoing outage being
      # announced every thirty minutes. If the job fails after alerting and that
      # file is not committed, the throttle resets and the spam resumes.
      - name: Record what was answered
        if: ${{ always() && inputs.dry_run != '1' }}
        run: |
          bash scripts/push-state.sh "chore: comment replies and leads [skip ci]" \
            state/replied.json state/our-comments.json state/leads.json state/alerts.json
