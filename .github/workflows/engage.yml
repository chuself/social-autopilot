name: engage

# Every 30 minutes: answer comments, escalate buying signals.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = classify and log, reply to nothing"
        default: "0"

concurrency: autopilot-state

jobs:
  engage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Read and answer comments
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHATSAPP_CTA_NUMBER: ${{ vars.WHATSAPP_CTA_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node src/cli-engage.js

      - name: Record what was answered
        if: ${{ inputs.dry_run != '1' }}
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add -A state
          git diff --staged --quiet || git commit -m "chore: comment replies and leads [skip ci]"
          git push
