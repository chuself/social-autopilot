name: reel

# Wakes twice a day; state/config.json decides how many reels a week actually
# get made, so the cadence is changeable from Telegram rather than in cron.
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post id to film (blank = next eligible)"
        default: ""
      dry_run:
        description: "1 = build the video, publish nothing"
        default: "0"

concurrency: autopilot-state

jobs:
  reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: npm ci --omit=dev || npm install --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: pip install edge-tts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Film it
        id: film
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/cli-reel.js "${{ inputs.post_id }}"

      # The MP4 must be publicly reachable before Instagram will fetch it.
      - name: Publish the file
        if: steps.film.outputs.built == 'true'
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -f public/*.mp4 state/queue.json
          git diff --staged --quiet || git commit -m "chore: reel built [skip ci]"
          git pull --rebase --autostash
          git push

      - uses: actions/configure-pages@v5
        if: steps.film.outputs.built == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.film.outputs.built == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: steps.film.outputs.built == 'true'

      - name: Wait for the file to go live
        if: steps.film.outputs.built == 'true'
        run: |
          FILE=$(node -e "const q=require('./state/queue.json');const p=q.filter(x=>x.reel&&x.reel.status==='ready').pop();if(!p){console.error('no reel marked ready');process.exit(1)}console.log(p.reel.file)")
          URL="${{ vars.PUBLIC_ASSET_BASE }}/$FILE"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "attempt $i: $CODE  $URL"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$URL never became reachable"
          exit 1

      - name: Post it
        if: steps.film.outputs.built == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          WHATSAPP_CTA_NUMBER: ${{ vars.WHATSAPP_CTA_NUMBER }}
          METRICOOL_KEY: ${{ secrets.METRICOOL_KEY }}
          METRICOOL_OAUTH: ${{ secrets.METRICOOL_OAUTH }}
          METRICOOL_BLOG_ID: ${{ vars.METRICOOL_BLOG_ID }}
          METRICOOL_USER_ID: ${{ vars.METRICOOL_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node src/cli-publish-reel.js

      - name: Record it
        if: steps.film.outputs.built == 'true' && inputs.dry_run != '1'
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add -A state
          git add -f state/metricool.enc 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: reel posted [skip ci]"
          git push

      - name: Shout if the reel failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node -e "import('./src/notify.js').then(m=>m.notifyFailure('Reel build or posting FAILED.','See the Actions log.'))"
